name: Update USL standings data

on:
  workflow_dispatch:

  schedule:
    # Runs every Monday at 8:00 AM UTC.
    # This is 1:00 AM Pacific during daylight saving time and 12:00 AM Pacific during standard time.
    - cron: "0 8 * * 1"

permissions:
  contents: write

jobs:
  update-usl-standings:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests lxml html5lib beautifulsoup4

      - name: Run USL standings fetch script
        run: |
          python scripts/fetch-usl-standings.py

      - name: Commit updated standings data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/usl/current-standings.json data/usl/standings-history.csv

          if git diff --staged --quiet; then
            echo "No standings data changes to commit."
          else
            git commit -m "Update USL standings data"
            git push
          fi
